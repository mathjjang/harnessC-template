# harness.yaml — 프로젝트 설정 단일 파일 (하네스C 코어 v0.3.2)
# init.mjs가 읽고, .harness/scripts/*가 읽는다. 티어를 바꾸면 문서를 고치지 않고 이 값을 바꾼다.

harness: 0.3.2
project: "{{PROJECT_NAME}}"
tier: S                      # S | M | L  — FDR 기본 프로파일·게이트 수·상시 규칙 상한
gate_mode: standard          # fast | standard | strict (FDR별 오버라이드 가능)
human_touchpoints: [spec, review]

ids:
  scheme: date-slug          # <TYPE>-<YYMMDD>-<slug>

requirements:
  mode: monorepo             # monorepo | separate-repo (다른 조직·역할이 쓰면 separate-repo)
  path: docs/requirements

budgets:
  always_on_kb: 18           # 규칙 파일 합계 상한 (S 18 · M 25 · L 40) — 코어 ~14.3KB + product.md 여유 (ADR-261017-s-tier-budget)
  core_kb: 10

review:
  independent_session: true
  model: null                # 리뷰어 모델. null이면 상속. 구현자와 다르게 두는 것을 권장

references: []               # 체크아웃 저장소 (submodule 아님). 훅 guard-reference가 쓰기를 판정한다 — 협업 저장소는 .harness/runbooks/collab.md
#  - { path: ../<proj>-mockups, role: mockup, mode: read-write, writable: [qa/] }   # 목업 저장소 — 별도 GitHub 저장소(기획·디자인 분리). 개발은 검수 건 resolution.md(qa/)만 쓴다. mockup-diff.mjs init separate
#  - { path: mockups, role: mockup, mode: read-write, embedded: true }             # 목업을 개발 저장소 안에(혼자 개발). mockup-diff.mjs init embedded — 기획 담당이 생기면 폴더째 분리

human_only: rules/human-only.yaml  # 사람만 할 수 있는 검증 등록부

work:                        # 동시 작업 (HARNESS §11 · runbooks/work.md) — 기록=브랜치=worktree
  dir: .worktrees            # worktree 자리 (gitignore). 형제 폴더가 필요하면 ../<proj>-wt
  base: main
  merge: ff                  # ff(S — 게이트 후 바로 병합) | pr(M·L — push 후 PR)
  link: []                   # worktree에 하드링크할 gitignore 재료 (예 .env.local)
  setup: ""                  # worktree 생성 후 1회 (예 pnpm install)

mockup:                      # 확정 목업 대조 (.harness/runbooks/mockup.md) — mockup-diff.mjs가 읽는다. 목업이 없는 프로젝트는 그대로 둔다(mockup/ 없는 FDR은 대상 아님)
  origin_env: APP_ORIGIN     # 구현 화면 오리진을 담은 환경변수 이름 — 값은 적지 않는다(사람마다 다르다 · 폴백 없음)
  viewport: 1440x900
  threshold: 0.01            # 불일치 % 상한 (V2 ADR-0037)
  wait: 1000                 # 캡처 전 정착 ms
  login: ""                  # 캡처 전 로그인 모듈(프로젝트 소유 · 예 rules/runbooks/mockup-login.mjs — export default async (page, env, { origin }))

metrics:
  enabled: true
